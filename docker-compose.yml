version: '3.8'

services:
  # Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=medical_research
      - DB_PORT=5432
    # Removed volume mounts that were overwriting built files
    depends_on:
      - postgres
    networks:
      - app-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_STATS_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network

  # Python Flask Statistics API
  flask-stats:
    build:
      context: ./flask-stats
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./flask-stats:/app
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app
    networks:
      - app-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=medical_research
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
